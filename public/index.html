<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #f4f6f8; }
    .navbar { background: #1f2a44; }

    
    #jobForm.editing {
      background: #e7f1ff;
      border-left: 4px solid #0d6efd;
      padding: 12px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  
  <nav class="navbar navbar-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Job Tracker</span>
      <span class="navbar-text">Keep track of your job applications.</span>
    </div>
  </nav>

  <main class="container pb-5">

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Add or edit a job</h2>

        <form id="jobForm">
          <input type="hidden" id="jobId">
          <div class="row g-3">
            <div class="col-md-6 col-lg-3">
              <label for="company" class="form-label">Company</label>
              <input id="company" class="form-control"  required>
            </div>
            <div class="col-md-6 col-lg-3">
              <label for="role" class="form-label">Role</label>
              <input id="role" class="form-control" required>
            </div>
            <div class="col-md-6 col-lg-3">
              <label for="status" class="form-label">Status</label>
              <select id="status" class="form-select">
                <option selected>applied</option>
                <option>interviewing</option>
                <option>offer</option>
                <option>rejected</option>
              </select>
            </div>
            <div class="col-md-6 col-lg-3">
              <label for="tags" class="form-label">Tags</label>
              <input id="tags" class="form-control">
            </div>
            <div class="col-12">
              <button id="saveBtn" class="btn btn-success">Add job</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    
    <div class="input-group mb-3">
      <input id="searchBox" class="form-control" placeholder="Search by company, role, or tag">
      <button id="searchBtn" class="btn btn-dark">Search</button>
      <button id="clearFilterBtn" class="btn btn-outline-dark">Show all</button>
    </div>

    <p id="message" class="text-danger fw-semibold"></p>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle mb-0">
          <thead class="table-light">
            <tr><th>Company</th><th>Role</th><th>Status</th><th>Tags</th><th>Notes</th><th></th></tr>
          </thead>
          <tbody id="jobList"></tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
